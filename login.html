<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — Dashboard Moderno</title>
  <style>
    /* ── Tokens ─────────────────────────────────────────── */
    :root {
      --color-bg:        #f0f2f5;
      --color-surface:   #ffffff;
      --color-nav:       #1e293b;
      --color-primary:   #3b82f6;
      --color-accent:    #38bdf8;
      --color-success:   #22c55e;
      --color-danger:    #ef4444;
      --color-text:      #1e293b;
      --color-muted:     #64748b;
      --color-border:    #e2e8f0;
      --radius-sm:       6px;
      --radius-md:       12px;
      --radius-lg:       20px;
      --shadow-card:     0 4px 24px rgba(0,0,0,.08);
      --shadow-focus:    0 0 0 3px rgba(59,130,246,.25);
      --transition:      .2s ease;
    }

    /* ── Reset ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--color-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Nav ────────────────────────────────────────────── */
    nav {
      background: var(--color-nav);
      padding: 0 32px;
      height: 60px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav-logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
    }
    .nav-logo svg { width: 18px; height: 18px; fill: #fff; }
    nav span {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -.3px;
    }

    /* ── Main layout ────────────────────────────────────── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }

    /* ── Card ───────────────────────────────────────────── */
    .card {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: 48px 44px;
      width: 100%;
      max-width: 420px;
    }

    .card-header { text-align: center; margin-bottom: 32px; }
    .card-icon {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
      border-radius: 16px;
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 16px;
    }
    .card-icon svg { width: 28px; height: 28px; fill: #fff; }
    .card-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--color-text);
      margin-bottom: 6px;
    }
    .card-header p { font-size: .9rem; color: var(--color-muted); }

    /* ── Form ───────────────────────────────────────────── */
    form { display: flex; flex-direction: column; gap: 20px; }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label {
      font-size: .82rem;
      font-weight: 600;
      color: var(--color-text);
      letter-spacing: .3px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrap .icon {
      position: absolute;
      left: 14px;
      color: var(--color-muted);
      display: flex;
      pointer-events: none;
    }
    .input-wrap .icon svg { width: 17px; height: 17px; }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 11px 14px 11px 42px;
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-size: .95rem;
      color: var(--color-text);
      background: #f8fafc;
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
      outline: none;
    }
    input:focus {
      border-color: var(--color-primary);
      background: var(--color-surface);
      box-shadow: var(--shadow-focus);
    }
    input.error { border-color: var(--color-danger); }

    /* toggle password */
    .btn-toggle {
      position: absolute;
      right: 12px;
      background: none; border: none; cursor: pointer;
      color: var(--color-muted);
      display: flex; padding: 4px;
      transition: color var(--transition);
    }
    .btn-toggle:hover { color: var(--color-text); }
    .btn-toggle svg { width: 17px; height: 17px; }

    /* ── Row: remember + forgot ─────────────────────────── */
    .row-extra {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: -6px;
    }
    .checkbox-label {
      display: flex; align-items: center; gap: 8px;
      font-size: .85rem; color: var(--color-muted); cursor: pointer;
    }
    .checkbox-label input[type="checkbox"] {
      width: 16px; height: 16px; padding: 0;
      accent-color: var(--color-primary);
      cursor: pointer;
    }
    .link {
      font-size: .85rem;
      color: var(--color-primary);
      text-decoration: none;
      font-weight: 500;
      transition: color var(--transition);
    }
    .link:hover { color: var(--color-accent); text-decoration: underline; }

    /* ── Alert ──────────────────────────────────────────── */
    .alert {
      display: none;
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      font-size: .87rem;
      font-weight: 500;
    }
    .alert.error  { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; display: flex; align-items: center; gap: 8px; }
    .alert.success{ background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; display: flex; align-items: center; gap: 8px; }
    .alert svg    { width: 16px; height: 16px; flex-shrink: 0; }

    /* ── Submit button ──────────────────────────────────── */
    .btn-primary {
      background: linear-gradient(135deg, var(--color-primary), #2563eb);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 13px;
      font-size: .97rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity var(--transition), transform var(--transition);
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-primary:hover  { opacity: .9; transform: translateY(-1px); }
    .btn-primary:active { opacity: 1;  transform: translateY(0);    }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; transform: none; }

    /* spinner */
    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Divider ────────────────────────────────────────── */
    .divider {
      display: flex; align-items: center; gap: 12px;
      font-size: .8rem; color: var(--color-muted);
    }
    .divider::before, .divider::after {
      content: ''; flex: 1;
      height: 1px; background: var(--color-border);
    }

    /* ── Footer link ────────────────────────────────────── */
    .card-footer {
      text-align: center;
      margin-top: 4px;
      font-size: .87rem;
      color: var(--color-muted);
    }
    .card-footer a { color: var(--color-primary); font-weight: 600; text-decoration: none; }
    .card-footer a:hover { text-decoration: underline; }

    /* ── Page footer ────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 20px;
      font-size: .8rem;
      color: var(--color-muted);
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav>
    <div class="nav-logo">
      <svg viewBox="0 0 24 24"><path d="M3 3h7v7H3zm11 0h7v7h-7zM3 14h7v7H3zm11 3a4 4 0 1 0 8 0 4 4 0 0 0-8 0z"/></svg>
    </div>
    <span>Dashboard Moderno</span>
  </nav>

  <!-- Main -->
  <main>
    <div class="card">

      <!-- Header -->
      <div class="card-header">
        <div class="card-icon">
          <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
        </div>
        <h1>Bienvenido de nuevo</h1>
        <p>Ingresa tus credenciales para continuar</p>
      </div>

      <!-- Alert -->
      <div class="alert" id="alert" role="alert"></div>

      <!-- Form -->
      <form id="loginForm" novalidate>

        <!-- Email -->
        <div class="field">
          <label for="email">Correo electrónico</label>
          <div class="input-wrap">
            <span class="icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="m2 7 10 7 10-7"/>
              </svg>
            </span>
            <input type="email" id="email" name="email"
                   placeholder="correo@ejemplo.com" autocomplete="email" required />
          </div>
        </div>

        <!-- Password -->
        <div class="field">
          <label for="password">Contraseña</label>
          <div class="input-wrap">
            <span class="icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input type="password" id="password" name="password"
                   placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="btn-toggle" id="togglePwd" aria-label="Mostrar contraseña">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember + Forgot -->
        <div class="row-extra">
          <label class="checkbox-label">
            <input type="checkbox" id="remember" />
            Recordarme
          </label>
          <a href="#" class="link">¿Olvidaste tu contraseña?</a>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-primary" id="submitBtn">
          <span class="spinner" id="spinner"></span>
          <span id="btnText">Iniciar sesión</span>
        </button>

        <!-- Divider -->
        <div class="divider">o continúa con</div>

        <!-- Footer link -->
        <div class="card-footer">
          ¿No tienes cuenta? <a href="#">Regístrate gratis</a>
        </div>

      </form>
    </div>
  </main>

  <!-- Page footer -->
  <footer>© 2026 Dashboard Moderno · Todos los derechos reservados</footer>

  <script>
    // ── Config Supabase ──────────────────────────────────
    // Reemplaza estos valores con los de tu proyecto Supabase
    const SUPABASE_URL = 'https://edrjcnykiyyvaoyoygbe.supabase.co';
    const SUPABASE_KEY = 'TU_ANON_KEY_AQUI';

    // ── Toggle contraseña ────────────────────────────────
    const toggleBtn = document.getElementById('togglePwd');
    const pwdInput  = document.getElementById('password');
    const eyeIcon   = document.getElementById('eyeIcon');

    const eyeOpen   = `<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>`;
    const eyeClosed = `<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`;

    toggleBtn.addEventListener('click', () => {
      const show = pwdInput.type === 'password';
      pwdInput.type  = show ? 'text' : 'password';
      eyeIcon.innerHTML = show ? eyeClosed : eyeOpen;
      toggleBtn.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
    });

    // ── Helpers ──────────────────────────────────────────
    function showAlert(msg, type = 'error') {
      const el = document.getElementById('alert');
      const icon = type === 'error'
        ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`
        : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`;
      el.innerHTML = icon + msg;
      el.className = `alert ${type}`;
    }
    function hideAlert() {
      document.getElementById('alert').style.display = 'none';
    }
    function setLoading(on) {
      document.getElementById('spinner').style.display = on ? 'block' : 'none';
      document.getElementById('btnText').textContent  = on ? 'Verificando…' : 'Iniciar sesión';
      document.getElementById('submitBtn').disabled   = on;
    }

    // ── Submit ───────────────────────────────────────────
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showAlert('Por favor completa todos los campos.');
        return;
      }

      setLoading(true);
      try {
        const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_KEY,
          },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (!res.ok) {
          const msg = data.error_description || data.message || 'Credenciales incorrectas.';
          showAlert(msg);
          document.getElementById('email').classList.add('error');
          document.getElementById('password').classList.add('error');
        } else {
          // Guardar sesión
          const storage = document.getElementById('remember').checked ? localStorage : sessionStorage;
          storage.setItem('sb_access_token',  data.access_token);
          storage.setItem('sb_refresh_token', data.refresh_token);
          showAlert('Sesión iniciada. Redirigiendo…', 'success');
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
        }
      } catch (err) {
        showAlert('Error de conexión. Intenta de nuevo.');
      } finally {
        setLoading(false);
      }
    });

    // Limpiar error al escribir
    ['email','password'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        document.getElementById(id).classList.remove('error');
        hideAlert();
      });
    });
  </script>
</body>
</html>
